name: Clean and audit Urdu Ibn Kathir

on:
  push:
    branches:
      - feature/tafseer-library-complete
    paths:
      - 'scripts/clean-ibn-kathir-urdu.mjs'
      - '.github/workflows/clean-ibn-kathir-urdu.yml'
      - 'tafseer-library/ibn-kathir-urdu/source/**'

permissions:
  contents: write

concurrency:
  group: ibn-kathir-urdu-cleanup
  cancel-in-progress: false

jobs:
  clean-and-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out library branch
        uses: actions/checkout@v4
        with:
          ref: feature/tafseer-library-complete
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check app JavaScript syntax
        run: node --check js/tafsir.js
      - name: Clean source files and verify every original passage and Ayah reference
        run: node scripts/clean-ibn-kathir-urdu.mjs
      - name: Commit canonical cleaned source and audit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tafseer-library/ibn-kathir-urdu
          if git diff --cached --quiet; then
            echo "Urdu Ibn Kathir source is already clean."
          else
            git commit -m "Clean Urdu Ibn Kathir source in place"
            git push origin feature/tafseer-library-complete
          fi
