<header class="site-header">
  <div class="nav-inner">
    <a class="brand" href="index.html">
      <svg class="star" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="5" y="5" width="14" height="14" rx="1.5"/><rect x="5" y="5" width="14" height="14" rx="1.5" transform="rotate(45 12 12)"/></svg>

    <button class="icon-btn" id="themeToggle" aria-label="Toggle theme"></button>
    <button class="icon-btn nav-toggle" id="navToggle" aria-label="Menu">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
  </div>
</header>

<main class="wrap reader" id="readerRoot">
  <div class="loader"><div class="star8"></div><span>Loading surah…</span></div>
</main>

<!-- sticky audio bar -->
<div class="audio-bar" id="audioBar" aria-live="polite">
  <button class="icon-btn" id="audioPlayPause" aria-label="Pause">
    <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>
  </button>
  <div class="who">
    <span id="audioLabel">—</span>
    <small>Qari Saud Al‑Shuraim</small>
  </div>
  <button class="icon-btn" id="audioStop" aria-label="Stop">
    <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="1"/></svg>
  </button>
</div>

<!-- settings drawer -->
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="Reading settings">
  <button class="icon-btn close" id="drawerClose" aria-label="Close settings">✕</button>
  <h3>Reading settings</h3>

  <div class="set">
    <label for="arSize">Arabic text size</label>
    <input type="range" id="arSize" min="22" max="48" step="1">
  </div>

  <div class="set">
    <label for="urduSel">Urdu translation</label>
    <select id="urduSel"></select>
  </div>

  <div class="set">
    <label for="engSel">English translation</label>
    <select id="engSel"></select>
  </div>

  <div class="set" id="tafsirSet" hidden>
    <label for="tafsirSel">Urdu tafseer</label>
    <select id="tafsirSel"></select>
  </div>

  <div class="set">
    <div class="row">
      <label style="margin:0" for="showUrdu">Show Urdu</label>
      <span class="switch"><input type="checkbox" id="showUrdu"><i></i></span>
    </div>
  </div>
  <div class="set">
    <div class="row">
      <label style="margin:0" for="showEnglish">Show English</label>
      <span class="switch"><input type="checkbox" id="showEnglish"><i></i></span>
    </div>
  </div>
  <div class="set">
    <div class="row">
      <label style="margin:0" for="autoNext">Auto‑play next ayah</label>
      <span class="switch"><input type="checkbox" id="autoNext"><i></i></span>
    </div>
  </div>
</aside>

<footer class="site-footer">
  <span class="ar">وَرَتِّلِ الْقُرْآنَ تَرْتِيلًا</span>

</footer>

</body>
</html>
